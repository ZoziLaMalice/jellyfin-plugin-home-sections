name: Build plugin

on:
  push:
    branches: [ jellyfin-12.3 ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      jellyfin_version:
        description: 'Jellyfin NuGet version to build against'
        required: false
        default: '12.3.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JELLYFIN_VERSION: ${{ github.event.inputs.jellyfin_version || '12.3.0' }}
      PROJECT: src/Jellyfin.Plugin.HomeScreenSections/Jellyfin.Plugin.HomeScreenSections.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet publish "$PROJECT" -c Release -p:JellyfinVersion=$JELLYFIN_VERSION -o out

      - name: Package
        run: |
          mkdir -p dist/HomeScreenSections
          cp out/Jellyfin.Plugin.HomeScreenSections.dll dist/HomeScreenSections/
          cp src/logo.png dist/HomeScreenSections/ 2>/dev/null || true
          VERSION=$(sed -n 's#.*<Version>\(.*\)</Version>.*#\1#p' "$PROJECT" | head -1)
          cat > dist/HomeScreenSections/meta.json <<EOF
          {
            "category": "General",
            "changelog": "Built from ${GITHUB_SHA}",
            "description": "Modular home screen sections (fork built for Jellyfin 12.3)",
            "guid": "b8298e01-2697-407a-b44d-aa8dc795e850",
            "name": "Home Screen Sections",
            "overview": "Home Screen Sections for Jellyfin $JELLYFIN_VERSION",
            "owner": "ZoziLaMalice",
            "targetAbi": "$JELLYFIN_VERSION.0",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "$VERSION",
            "status": "Active",
            "autoUpdate": false,
            "imagePath": "",
            "assemblies": ["Jellyfin.Plugin.HomeScreenSections.dll"]
          }
          EOF
          cd dist && zip -r "../HomeScreenSections-jf$JELLYFIN_VERSION.zip" HomeScreenSections

      - uses: actions/upload-artifact@v4
        with:
          name: HomeScreenSections-jf${{ env.JELLYFIN_VERSION }}
          path: HomeScreenSections-jf*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HomeScreenSections-jf*.zip
